name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check index.js
          node --check client.js
      - name: Unit, integration, and client tests
        run: npm test
      - name: Acceptance
        run: npm run acceptance
      - name: Smoke
        run: npm run smoke
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
